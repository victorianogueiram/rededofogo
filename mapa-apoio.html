<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caminho do Fogo | Mapa de Apoio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Anek+Latin:wght@400;500;600&family=Darker+Grotesque:wght@600&family=Roboto:wght@400&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Cal Sans';
    font-style: normal;
    font-display: swap;
    font-weight: 400;
    src: url(https://cdn.jsdelivr.net/fontsource/fonts/cal-sans@5.3.0/latin-400-normal.woff2) format('woff2'),
         url(https://cdn.jsdelivr.net/fontsource/fonts/cal-sans@5.3.0/latin-400-normal.woff) format('woff');
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }

  :root {
    --heat-1: #FCEAC8; --heat-2: #F7C96E; --heat-3: #E5761A; --heat-4: #B7400F; --heat-5: #5A1907;
    --canopy-100: #D8E8C6; --canopy-300: #87B168; --canopy-500: #4F7A35;
    --water-100: #CEDEEA; --water-500: #3D6B8A;
    --alert-100: #FBDED9; --alert-500: #C2381E;
    --ink: #130F0C; --bone: #E8E5DD; --text-primary: #221511; --text-secondary: #30302F;
    --bg-app: #F6F5F4; --border-hairline: rgba(0,0,0,0.1);
    --radius-sm: 4px; --radius-default: 8px; --radius-lg: 12px; --radius-icon: 21px;
    --font-display: 'Cal Sans', 'Poppins', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --font-body: 'Anek Latin', sans-serif;
    --font-cta: 'Darker Grotesque', sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg-app); color: var(--text-primary); font-family: var(--font-body); line-height: 1.5; }

  /* ---------- Top bar ---------- */

  /* ---------- Top bar (logo + título da tela) ---------- */
  .topbar .brand { display: flex; align-items: center; gap: 16px; }
  .brand-logo-link { display: inline-flex; line-height: 0; }
  .brand-logo { height: 30px; width: auto; display: block; }
  .brand-sep { width: 1px; height: 32px; background: var(--border-hairline); }
  .brand-text .eyebrow {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--heat-4);
    margin: 0 0 2px;
  }
  .topbar-close {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-default);
    padding: 8px 14px;
    background: transparent;
  }
  a.topbar-close { text-decoration: none; display: inline-block; }
  a.topbar-close:hover { border-color: var(--heat-4); color: var(--heat-4); opacity: 1; }

  .topbar {
    background: #fff;
    padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--bone);
  }
  .topbar .brand { display: flex; align-items: center; gap: 12px; }
  .brand-text h1 { font-family: var(--font-display); font-weight: 400; font-size: 20px; margin: 0; letter-spacing: 0.4px; }

  /* ---------- Shell: sidebar + mapa + painel ---------- */
  .app-shell { display: flex; height: calc(100vh - 61px); }

  .sidebar {
    width: 340px;
    flex-shrink: 0;
    border-right: 1px solid var(--border-hairline);
    background: #fff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-filters {
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--border-hairline);
  }

  .sidebar-filters h2 {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--heat-4);
    margin: 0 0 12px;
  }

  .filter-field { margin-bottom: 10px; }
  .filter-field:last-child { margin-bottom: 0; }
  .filter-field label {
    display: block;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.2px;
    color: var(--text-secondary);
    opacity: 0.7;
    margin-bottom: 4px;
  }
  .filter-field select {
    width: 100%;
    font-family: var(--font-body);
    font-size: 13.5px;
    color: var(--text-primary);
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-default);
    padding: 8px 10px;
    background: #fff;
  }
  .filter-field select {
    appearance: none; -webkit-appearance: none;
    background: #fff url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256' fill='%2330302F'%3E%3Cpath d='M213.66%2C101.66l-80%2C80a8%2C8%2C0%2C0%2C1-11.32%2C0l-80-80A8%2C8%2C0%2C0%2C1%2C53.66%2C90.34L128%2C164.69l74.34-74.35a8%2C8%2C0%2C0%2C1%2C11.32%2C11.32Z'/%3E%3C/svg%3E") no-repeat right 10px center / 14px;
    padding-right: 32px;
  }
  .filter-field select:focus { outline: 2px solid var(--heat-3); outline-offset: 1px; }

  .sidebar-listhead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border-hairline);
  }
  .sidebar-listhead span {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: var(--text-secondary);
    opacity: 0.6;
  }

  .brigade-list { flex: 1; overflow-y: auto; padding: 10px; }

  .brigade-card {
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-default);
    padding: 12px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .brigade-card:hover { border-color: var(--heat-3); }
  .brigade-card.active { border-color: var(--heat-4); background: rgba(252,234,200,0.45); }

  .brigade-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .urgency-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .urgency-dot.alta { background: var(--alert-500); }
  .urgency-dot.media { background: var(--heat-3); }
  .urgency-dot.estavel { background: var(--canopy-500); }

  .brigade-card-name { font-weight: 600; font-size: 14.5px; }
  .brigade-card-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.2px;
    color: var(--text-secondary);
    opacity: 0.75;
    margin: 0 0 8px;
  }
  .brigade-card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .brigade-card-tag {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-sm);
    padding: 3px 6px;
    background: var(--bg-app);
  }

  /* ---------- Mapa (mock) ---------- */
  .map-area {
    flex: 1;
    position: relative;
    background:
      linear-gradient(rgba(255,255,255,0.55), rgba(255,255,255,0.55)),
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(0,0,0,0.05) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(0,0,0,0.05) 40px),
      var(--canopy-100);
    overflow: hidden;
  }

  .map-legend {
    position: absolute;
    top: 16px; left: 16px;
    background: #fff;
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-default);
    padding: 10px 14px;
    display: flex;
    gap: 14px;
    z-index: 5;
  }
  .map-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }

  .map-pin {
    position: absolute;
    width: 18px; height: 18px;
    border-radius: 50% 50% 50% 0;
    transform: translate(-50%, -100%) rotate(-45deg);
    cursor: pointer;
    border: 2px solid #fff;
  }
  .map-pin.alta { background: var(--alert-500); }
  .map-pin.media { background: var(--heat-3); }
  .map-pin.estavel { background: var(--canopy-500); }
  .map-pin.active { outline: 3px solid var(--ink); outline-offset: 2px; }
  .map-pin.hidden-pin { display: none; }

  .map-note {
    position: absolute;
    bottom: 16px; right: 16px;
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: var(--text-secondary);
    opacity: 0.85;
    background: #fff;
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-sm);
    padding: 5px 9px;
  }

  /* ---------- Painel de detalhe ---------- */
  .detail-panel {
    width: 380px;
    flex-shrink: 0;
    border-left: 1px solid var(--border-hairline);
    background: #fff;
    overflow-y: auto;
    display: none;
  }
  .detail-panel.open { display: block; }

  .detail-close {
    display: flex;
    justify-content: flex-end;
    padding: 12px 16px 0;
  }
  .detail-close button {
    border: none; background: none; cursor: pointer; color: var(--text-secondary); opacity: 0.75;
    line-height: 0; padding: 4px; border-radius: var(--radius-sm);
  }

  .detail-head { padding: 4px 22px 18px; border-bottom: 1px solid var(--border-hairline); }
  .detail-eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-weight: 700; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.3px; margin: 0 0 8px;
  }
  .detail-eyebrow.alta { color: var(--alert-500); }
  .detail-eyebrow.media { color: var(--heat-4); }
  .detail-eyebrow.estavel { color: var(--canopy-500); }
  .detail-title { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0 0 6px; }
  .detail-sub { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); opacity: 0.7; margin: 0; }

  .detail-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border-hairline);
  }
  .detail-stat { background: var(--bg-app); border-radius: var(--radius-default); padding: 12px 10px; text-align: center; }
  .detail-stat-value { font-family: var(--font-display); font-weight: 400; font-size: 22px; color: var(--heat-4); margin: 0; }
  .detail-stat-label {
    font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.2px;
    color: var(--text-secondary); opacity: 0.75; margin: 4px 0 0;
  }

  .detail-section { padding: 18px 22px; border-bottom: 1px solid var(--border-hairline); }
  .detail-section:last-child { border-bottom: none; }
  .detail-section h4 {
    font-family: var(--font-mono); font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.3px; color: var(--heat-4); margin: 0 0 12px;
  }

  .pedido-row {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--border-hairline); border-radius: var(--radius-default);
    padding: 10px; margin-bottom: 8px; font-size: 13.5px;
  }
  .pedido-row:last-child { margin-bottom: 0; }
  .pedido-tag {
    font-family: var(--font-mono); font-size: 11px; font-weight: 700; text-transform: uppercase;
    color: #fff; background: var(--heat-4); border-radius: var(--radius-sm); padding: 3px 7px; flex-shrink: 0;
  }
  .pedido-empty { font-size: 13.5px; color: var(--text-secondary); opacity: 0.6; font-style: italic; }

  .historico-item {
    display: flex; gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border-hairline);
    font-size: 13px;
  }
  .historico-item:last-child { border-bottom: none; }
  .historico-date {
    font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); opacity: 0.75;
    white-space: nowrap; flex-shrink: 0; padding-top: 1px;
  }

  .btn-primary {
    background: var(--heat-4); color: #fff;
    font-family: var(--font-cta); font-weight: 600; font-size: 16px; letter-spacing: 0.16px;
    border: none; border-radius: var(--radius-default);
    padding: 10px 16px; width: 100%; cursor: pointer;
  }
</style>
</head>

<header class="topbar">

    <span class="brand-sep"></span>

<div class="app-shell">

  <div class="sidebar">
    <div class="sidebar-filters">
      <h2>Filtros</h2>
      <div class="filter-field">
        <label for="filtroRegiao">Região / território</label>
        <select id="filtroRegiao"><option value="">Todas</option></select>
      </div>
      <div class="filter-field">
        <label for="filtroNecessidade">Tipo de necessidade</label>
        <select id="filtroNecessidade">
          <option value="">Todas</option>
          <option>Equipamentos</option>
          <option>Brigadistas</option>
          <option>Logística</option>
          <option>Estrutura</option>
          <option>Financeiro</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="filtroUrgencia">Nível de urgência</label>
        <select id="filtroUrgencia">
          <option value="">Todos</option>
          <option value="alta">Alta</option>
          <option value="media">Média</option>
          <option value="estavel">Estável</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="filtroTipoBrigada">Tipo de brigada</label>
        <select id="filtroTipoBrigada">
          <option value="">Todas</option>
          <option>Comunitária</option>
          <option>Indígena</option>
          <option>Institucional</option>
          <option>Mista</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="filtroVolume">Volume de atuação</label>
        <select id="filtroVolume">
          <option value="">Todos</option>
          <option>Alto</option>
          <option>Médio</option>
          <option>Baixo</option>
        </select>
      </div>
    </div>
    <div class="sidebar-listhead">
      <span id="listCount">0 brigadas</span>
    </div>
    <div class="brigade-list" id="brigadeList"></div>
  </div>

  <div class="map-area" id="mapArea">
    <div class="map-legend">
      <div class="map-legend-item"><span class="urgency-dot alta"></span> Alta demanda</div>
      <div class="map-legend-item"><span class="urgency-dot media"></span> Média</div>
      <div class="map-legend-item"><span class="urgency-dot estavel"></span> Estável</div>
    </div>
    <div class="map-note">Mapa ilustrativo, sem geolocalização real</div>
  </div>

  <div class="detail-panel" id="detailPanel">
    <div class="detail-close"><button id="btnCloseDetail" type="button" aria-label="Fechar detalhes"><svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg></button></div>
    <div class="detail-head">
      <p class="detail-eyebrow" id="detailUrgencyLabel">Urgência</p>
      <h3 class="detail-title" id="detailName">Nome da brigada</h3>
      <p class="detail-sub" id="detailMeta">Território · Tipo</p>
    </div>
    <div class="detail-stats">
      <div class="detail-stat"><p class="detail-stat-value" id="detailIncendios">0</p><p class="detail-stat-label">Incêndios recentes</p></div>
      <div class="detail-stat"><p class="detail-stat-value" id="detailAcoes">0</p><p class="detail-stat-label">Ações</p></div>
      <div class="detail-stat"><p class="detail-stat-value" id="detailPedidosCount">0</p><p class="detail-stat-label">Pedidos ativos</p></div>
    </div>
    <div class="detail-section">
      <h4>Pedidos de apoio ativos</h4>
      <div id="detailPedidos"></div>
    </div>
    <div class="detail-section">
      <h4>Histórico recente</h4>
      <div id="detailHistorico"></div>
    </div>
    <div class="detail-section">
      <button class="btn-primary" type="button">Oferecer apoio a esta brigada →</button>
    </div>
  </div>

</div>

<script>
  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  const BRIGADAS = [
    { id: "b1", nome: "Brigada Cerrado Vivo", territorio: "Formosa/GO", tipo: "Comunitária", urgencia: "alta", necessidades: ["Brigadistas", "Equipamentos"], volume: "Alto", incendios: 4, acoes: 12, pedidos: [{ tipo: "Brigadistas", desc: "5 vagas para reforço até 05/08" }, { tipo: "Equipamentos", desc: "Abafadores e bombas costais" }], historico: [["14/07", "Registrou novo incêndio"], ["10/07", "Recebeu apoio de Logística"], ["02/07", "Publicou chamada de brigadistas"]], pos: { x: 28, y: 34 } },
    { id: "b2", nome: "Brigada Água Fria", territorio: "Água Fria de Goiás/GO", tipo: "Institucional", urgencia: "media", necessidades: ["Logística"], volume: "Médio", incendios: 2, acoes: 7, pedidos: [{ tipo: "Logística", desc: "Apoio com transporte de equipe" }], historico: [["16/07", "Concluiu ação de combate"], ["11/07", "Registrou incêndio"]], pos: { x: 52, y: 22 } },
    { id: "b3", nome: "Brigada Chapada Norte", territorio: "Alto Paraíso/GO", tipo: "Indígena", urgencia: "estavel", necessidades: [], volume: "Baixo", incendios: 0, acoes: 3, pedidos: [], historico: [["05/07", "Concluiu monitoramento de rotina"]], pos: { x: 68, y: 46 } },
    { id: "b4", nome: "Brigada Vale Verde", territorio: "Niquelândia/GO", tipo: "Mista", urgencia: "alta", necessidades: ["Equipamentos", "Financeiro"], volume: "Alto", incendios: 5, acoes: 15, pedidos: [{ tipo: "Equipamentos", desc: "Mangueiras e EPIs" }, { tipo: "Financeiro", desc: "Custeio de combustível" }, { tipo: "Brigadistas", desc: "Reforço para os próximos 3 dias" }], historico: [["17/07", "Registrou 2 novos incêndios"], ["15/07", "Recebeu apoio financeiro"], ["09/07", "Publicou chamada de brigadistas"]], pos: { x: 40, y: 62 } },
    { id: "b5", nome: "Brigada Serra Dourada", territorio: "Pirenópolis/GO", tipo: "Comunitária", urgencia: "media", necessidades: ["Brigadistas"], volume: "Médio", incendios: 1, acoes: 5, pedidos: [{ tipo: "Brigadistas", desc: "3 vagas, nível intermediário" }], historico: [["13/07", "Registrou incêndio"]], pos: { x: 22, y: 74 } },
    { id: "b6", nome: "Brigada Rio Preto", territorio: "Cavalcante/GO", tipo: "Institucional", urgencia: "estavel", necessidades: [], volume: "Baixo", incendios: 0, acoes: 2, pedidos: [], historico: [["28/06", "Concluiu treinamento interno"]], pos: { x: 78, y: 68 } },
    { id: "b7", nome: "Brigada Terra Ronca", territorio: "São Domingos/GO", tipo: "Comunitária", urgencia: "alta", necessidades: ["Estrutura", "Brigadistas"], volume: "Alto", incendios: 3, acoes: 9, pedidos: [{ tipo: "Estrutura", desc: "Apoio com alojamento temporário" }, { tipo: "Brigadistas", desc: "4 vagas para combate" }], historico: [["16/07", "Registrou incêndio"], ["12/07", "Publicou pedido de estrutura"]], pos: { x: 60, y: 82 } },
    { id: "b8", nome: "Brigada Kalunga", territorio: "Cavalcante/GO", tipo: "Indígena", urgencia: "media", necessidades: ["Logística", "Financeiro"], volume: "Médio", incendios: 2, acoes: 6, pedidos: [{ tipo: "Logística", desc: "Apoio com deslocamento" }], historico: [["10/07", "Registrou incêndio"], ["04/07", "Recebeu apoio de Financeiro"]], pos: { x: 82, y: 40 } }
  ];

  let activeId = null;

  function renderRegiaoOptions() {
    const sel = document.getElementById("filtroRegiao");
    const territorios = [...new Set(BRIGADAS.map(b => b.territorio))].sort();
    territorios.forEach(t => {
      const opt = el("option", null, t);
      opt.value = t;
      sel.appendChild(opt);
    });
  }

  function currentFilters() {
    return {
      regiao: document.getElementById("filtroRegiao").value,
      necessidade: document.getElementById("filtroNecessidade").value,
      urgencia: document.getElementById("filtroUrgencia").value,
      tipoBrigada: document.getElementById("filtroTipoBrigada").value,
      volume: document.getElementById("filtroVolume").value
    };
  }

  function filteredBrigadas() {
    const f = currentFilters();
    return BRIGADAS.filter(b =>
      (!f.regiao || b.territorio === f.regiao) &&
      (!f.necessidade || b.necessidades.includes(f.necessidade)) &&
      (!f.urgencia || b.urgencia === f.urgencia) &&
      (!f.tipoBrigada || b.tipo === f.tipoBrigada) &&
      (!f.volume || b.volume === f.volume)
    );
  }

  function urgencyLabel(u) {
    return u === "alta" ? "Alta demanda" : u === "media" ? "Média demanda" : "Estável";
  }

  function renderList() {
    const visible = filteredBrigadas();
    const visibleIds = visible.map(b => b.id);
    document.getElementById("listCount").textContent = `${visible.length} brigada${visible.length === 1 ? "" : "s"}`;

    const list = document.getElementById("brigadeList");
    list.innerHTML = "";
    visible.forEach(b => {
      const card = el("div", "brigade-card" + (b.id === activeId ? " active" : ""));
      card.addEventListener("click", () => selectBrigada(b.id));
      const top = el("div", "brigade-card-top");
      top.appendChild(el("span", "urgency-dot " + b.urgencia));
      top.appendChild(el("span", "brigade-card-name", b.nome));
      card.appendChild(top);
      card.appendChild(el("p", "brigade-card-meta", `${b.territorio} · ${b.tipo}`));
      const tags = el("div", "brigade-card-tags");
      if (b.pedidos.length) tags.appendChild(el("span", "brigade-card-tag", `${b.pedidos.length} pedido(s) ativo(s)`));
      (b.necessidades.length ? b.necessidades : ["Sem necessidades no momento"]).forEach(n => tags.appendChild(el("span", "brigade-card-tag", n)));
      card.appendChild(tags);
      list.appendChild(card);
    });

    document.querySelectorAll(".map-pin").forEach(pin => {
      pin.classList.toggle("hidden-pin", !visibleIds.includes(pin.dataset.id));
    });

    if (activeId && !visibleIds.includes(activeId)) closeDetail();
  }

  function renderPins() {
    const mapArea = document.getElementById("mapArea");
    BRIGADAS.forEach(b => {
      const pin = el("div", "map-pin " + b.urgencia);
      pin.style.left = b.pos.x + "%";
      pin.style.top = b.pos.y + "%";
      pin.dataset.id = b.id;
      pin.title = b.nome;
      pin.addEventListener("click", () => selectBrigada(b.id));
      mapArea.appendChild(pin);
    });
  }

  function selectBrigada(id) {
    activeId = id;
    const b = BRIGADAS.find(x => x.id === id);
    document.querySelectorAll(".map-pin").forEach(p => p.classList.toggle("active", p.dataset.id === id));
    document.querySelectorAll(".brigade-card").forEach((card, i) => {});
    renderList();

    document.getElementById("detailPanel").classList.add("open");
    const urgEl = document.getElementById("detailUrgencyLabel");
    urgEl.textContent = urgencyLabel(b.urgencia);
    urgEl.className = "detail-eyebrow " + b.urgencia;
    document.getElementById("detailName").textContent = b.nome;
    document.getElementById("detailMeta").textContent = `${b.territorio} · ${b.tipo} · Volume ${b.volume.toLowerCase()}`;
    document.getElementById("detailIncendios").textContent = b.incendios;
    document.getElementById("detailAcoes").textContent = b.acoes;
    document.getElementById("detailPedidosCount").textContent = b.pedidos.length;

    const pedidosEl = document.getElementById("detailPedidos");
    pedidosEl.innerHTML = "";
    if (b.pedidos.length === 0) {
      pedidosEl.appendChild(el("p", "pedido-empty", "Nenhum pedido ativo no momento."));
    } else {
      b.pedidos.forEach(p => {
        const row = el("div", "pedido-row");
        row.appendChild(el("span", "pedido-tag", p.tipo));
        row.appendChild(el("span", null, p.desc));
        pedidosEl.appendChild(row);
      });
    }

    const histEl = document.getElementById("detailHistorico");
    histEl.innerHTML = "";
    b.historico.forEach(([data, texto]) => {
      const item = el("div", "historico-item");
      item.appendChild(el("span", "historico-date", data));
      item.appendChild(el("span", null, texto));
      histEl.appendChild(item);
    });
  }

  function closeDetail() {
    activeId = null;
    document.getElementById("detailPanel").classList.remove("open");
    document.querySelectorAll(".map-pin").forEach(p => p.classList.remove("active"));
    renderList();
  }

  document.getElementById("btnCloseDetail").addEventListener("click", closeDetail);
  ["filtroRegiao", "filtroNecessidade", "filtroUrgencia", "filtroTipoBrigada", "filtroVolume"].forEach(id => {
    document.getElementById(id).addEventListener("change", renderList);
  });

  renderRegiaoOptions();
  renderPins();
  renderList();
</script>

</body>
